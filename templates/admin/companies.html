{% extends "base.html" %}
{% block title %}Companies{% endblock %}
{% block content %}
<h3 class="mb-4"><i class="bi bi-buildings"></i> Companies</h3>

<div class="row g-4">
    <div class="col-lg-4">
        <div class="card p-3">
            <h5 class="mb-3">Add Company</h5>
            <form method="POST">
                <div class="mb-2">
                    <label class="form-label">Name</label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="mb-2">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="form-control" rows="2"></textarea>
                </div>
                <div class="mb-2">
                    <label class="form-label">Website</label>
                    <input type="text" name="website" class="form-control">
                </div>
                <button type="submit" class="btn brand-btn w-100">Add Company</button>
            </form>
        </div>
    </div>
    <div class="col-lg-8">
        <div class="card p-3">
            <h5 class="mb-3">All Companies</h5>
            <table class="table align-middle mb-0">
                <thead><tr><th>Name</th><th>Description</th><th>Jobs</th><th></th></tr></thead>
                <tbody>
                    {% for c in companies %}
                    <tr>
                        <td>{{ c.name }}</td>
                        <td class="small text-muted">{{ c.description }}</td>
                        <td>{{ c.jobs|length }}</td>
                        <td>
                            <form method="POST" action="{{ url_for('admin.delete_company', company_id=c.id) }}" onsubmit="return confirm('Delete this company and all its jobs?');">
                                <button class="btn btn-sm btn-outline-danger">Delete</button>
                            </form>
                        </td>
                    </tr>
                    {% else %}
                    <tr><td colspan="4" class="text-muted">No companies added yet.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
