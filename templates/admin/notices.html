{% extends "base.html" %}
{% block title %}Notices{% endblock %}
{% block content %}
<h3 class="mb-4"><i class="bi bi-megaphone"></i> Placement Notices</h3>

<div class="row g-4">
    <div class="col-lg-5">
        <div class="card p-3">
            <h5 class="mb-3">Publish Notice</h5>
            <form method="POST">
                <div class="mb-2">
                    <label class="form-label">Title</label>
                    <input type="text" name="title" class="form-control" required>
                </div>
                <div class="mb-2">
                    <label class="form-label">Content</label>
                    <textarea name="content" class="form-control" rows="4"></textarea>
                </div>
                <button type="submit" class="btn brand-btn w-100">Publish</button>
            </form>
        </div>
    </div>
    <div class="col-lg-7">
        <div class="card p-3">
            <h5 class="mb-3">All Notices</h5>
            {% for n in notices %}
            <div class="border-bottom py-2 d-flex justify-content-between align-items-start">
                <div>
                    <strong>{{ n.title }}</strong>
                    <p class="text-muted small mb-0">{{ n.content }}</p>
                    <p class="text-muted small mb-0">{{ n.created_at.strftime('%d %b %Y') }}</p>
                </div>
                <form method="POST" action="{{ url_for('admin.delete_notice', notice_id=n.id) }}">
                    <button class="btn btn-sm btn-outline-danger">Delete</button>
                </form>
            </div>
            {% else %}
            <p class="text-muted">No notices published yet.</p>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
